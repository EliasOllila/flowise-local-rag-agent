version: '3.8'

services:
  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    restart: always
    environment:
      - PORT=3000
      - FLOWISE_USERNAME=admin
      - FLOWISE_PASSWORD=password123
      - SECRETKEY=your-custom-secret-key-change-this
    ports:
      - "3000:3000"
    volumes:
      - ~/.flowise:/root/.flowise
